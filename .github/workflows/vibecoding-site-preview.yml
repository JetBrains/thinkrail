name: Vibecoding website preview

on:
  pull_request:
    paths:
      - "apps/vibecoding-website/**"
      - "packages/website-analytics/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/vibecoding-site-preview.yml"

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: vibecoding-site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.thinkrail-vibecoding.pages.dev
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @thinkrail/vibecoding-website build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          bunx wrangler@4.124.0 pages deploy apps/vibecoding-website/dist
          --project-name=thinkrail-vibecoding
          --branch="pr-${{ github.event.pull_request.number }}"
      - name: Wait for preview to serve
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/")
            [ "$code" = "200" ] && echo "preview live ($code)" && exit 0
            echo "attempt $attempt: $code — retrying in 5s"
            sleep 5
          done
          echo "preview never became reachable" >&2
          exit 1
      - name: Sticky PR comment and commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- thinkrail-vibecoding-site-preview -->'
          body="$marker
          ### 🌐 Vibecoding website preview

          | | |
          | --- | --- |
          | **Preview** | $PREVIEW_URL |
          | **Commit** | $HEAD_SHA |

          _This comment updates in place on every push that touches the vibecoding website or shared build inputs._"
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id][0] // empty")
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="Vibecoding website preview" \
            -f description="pr-$PR.thinkrail-vibecoding.pages.dev" \
            -f target_url="$PREVIEW_URL" > /dev/null
