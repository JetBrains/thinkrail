name: Release pi packages

# Publishes the pi packages under pi-extensions/*, the extension SDK (packages/extension-sdk) and the sample
# extensions under extension-examples/* (see pi-extensions/SPEC.md → Release, packages/extension-sdk/SPEC.md).
# Versioning is a human step: `bun run release:version` in an ordinary PR consumes the pending changesets
# and bumps versions/changelogs. When that PR reaches main with no changesets left, this workflow packs
# with bun and publishes with npm through Trusted Publishing (OIDC) — no npm tokens. Each new package
# needs one manual bootstrap publish first.
on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "pi-extensions/**"
      - "packages/extension-sdk/**"
      - "extension-examples/**"
      - ".github/workflows/release-pi-packages.yml"
      - "scripts/pi-packages.ts"
      - "scripts/publish-pi-packages.ts"
      - "scripts/check-extension-packages.ts"
  workflow_dispatch:

concurrency:
  group: release-pi-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm ≥ 11.5.1; the Node 22 image ships an older npm.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check:pi-packages
      - run: bun run check:extension-packages
      # A sample's prepack builds with the SDK's dist/, which exists only once the SDK is built.
      - run: bun run --cwd packages/extension-sdk build
      - id: publish
        run: bun run release:publish -- --github-output "$GITHUB_OUTPUT"
      # Tag when every current version is on npm (published now or earlier, e.g. the manual bootstrap);
      # never while changesets are pending, so the placeholder 0.0.0 is never tagged. `changeset tag`
      # skips tags that already exist, so a retry after a failed tag push is safe.
      - name: Tag released versions
        if: steps.publish.outputs.readyToTag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bun x changeset tag
          git push --tags
