name: CI

# Fast gates for every PR targeting main: lint + typecheck, unit tests, and the
# no-agent e2e suite (the @agent specs need a real provider + auth, so they stay out of CI).
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Supersede in-flight runs when a PR is updated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check:deps
      - run: bun run check:boundaries
      # Canary for the compiled-binary seam: fails when a pi bump introduces a new bundler-opaque
      # dynamic import that registerBundledRuntime doesn't statically register (see the script header).
      - run: bun run check:seams
      - run: bun run check:spec-surface
      - run: bun run lint
      - run: bun run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test

  pi-packages:
    name: Pi package parity (vanilla pi under Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vanilla pi is an npm CLI on Node; the gate loads the packed packages under Node on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check:pi-packages

  e2e-shard:
    name: E2E (no-agent) shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      THINKRAIL_E2E_JOB_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      # `bun run e2e` is self-contained: it builds the web app, boots the host on an isolated
      # port + state dir, runs this job's slice of the @agent-free suite headless, then tears it all down.
      - run: bun run e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Required-check name in the main ruleset: aggregates the shard matrix.
  e2e:
    name: E2E (no-agent)
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success

  binary-shard:
    name: Binary smoke & e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Build the single-file binary for the runner's platform, then boot the artifact and assert it
      # serves the staged UI + skills, completes a real OAuth login up to its auth URL, and shuts down
      # cleanly — regressions in the extension/asset/provider-flow bundling only exist inside the
      # compiled binary, so from-source suites can't catch them.
      - run: bun run build:binary
      - run: bun run smoke:binary
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      # This shard of the no-agent e2e suite against the artifact (grep-inverts @dev-seam too — the fake
      # login providers only exist in the dev boot): the broad net for works-from-source/broken-in-the-binary.
      - run: bun run e2e:binary --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-binary-${{ matrix.shard }}
          path: playwright-report-binary/
          retention-days: 7

  # Required-check name in the main ruleset: aggregates the shard matrix.
  binary:
    name: Binary smoke & e2e
    needs: binary-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.binary-shard.result }}" = success

  binary-windows:
    name: Binary smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun test packages/spec-graph
      - run: bun test packages/pi-background-commands
      - run: bun test packages/server/src/subprocess
      - run: bun test apps/desktop/src/windowsFrame.test.ts apps/desktop/src/windowChrome.test.ts
      - run: bun run build:binary
      - run: bun run smoke:binary

  desktop-shard:
    name: Desktop smoke & e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install desktop and browser runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 xauth xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2
          bunx playwright install --with-deps chromium
      - run: bun run desktop:build
      - name: Smoke native desktop window and packaged runtime
        run: env LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a bun run smoke:desktop
      - name: Run no-agent e2e against the embedded desktop host
        run: env LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a bun run e2e:desktop --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-desktop-${{ matrix.shard }}
          path: playwright-report-desktop/
          retention-days: 7

  # Required-check name in the main ruleset: aggregates the shard matrix.
  desktop:
    name: Desktop smoke & e2e
    needs: desktop-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.desktop-shard.result }}" = success
