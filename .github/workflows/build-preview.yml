name: Preview artifacts

on:
  workflow_dispatch:
  push:
    branches: [main, feat/tomato-issues-workflow]

permissions:
  contents: read

concurrency:
  group: preview-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Unsigned Windows preview
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Prepare desktop toolchain
        shell: bash
        run: bash .github/scripts/prepare-electrobun.sh
      - name: Build CLI binary
        run: bun run build:binary
      - name: Upload CLI binary
        uses: actions/upload-artifact@v5
        with:
          name: oh-my-thinkrail-windows-cli-${{ github.sha }}
          path: apps/cli/dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Build unsigned desktop preview
        run: bun run desktop:build
      - name: Archive desktop bundle
        shell: pwsh
        run: |
          if (!(Test-Path apps/desktop/build)) { throw 'Desktop build directory missing' }
          Compress-Archive -Path apps/desktop/build/* -DestinationPath oh-my-thinkrail-windows-desktop.zip
      - name: Upload desktop preview
        uses: actions/upload-artifact@v5
        with:
          name: oh-my-thinkrail-windows-desktop-${{ github.sha }}
          path: oh-my-thinkrail-windows-desktop.zip
          if-no-files-found: error
          retention-days: 14
