name: Build native artifacts

# Native OS matrix: each runner builds and smokes both launchers for its own platform, so the PTY FFI,
# trash helper, ownership lease, Electrobun wrapper, and system renderer execute where they will ship.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to bake into binaries (e.g. 0.2.0-nightly.5)"
        required: true
        type: string
      channel:
        description: "Release channel: nightly or stable"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: bun-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
          # Disabled: the macos-13 (Intel) runner queue is long enough to stall every release. Re-enable
          # if macOS x64 downloads are needed (Apple Silicon is the default mac target below).
          # - os: macos-13
          #   target: bun-darwin-x64
          - os: macos-14
            target: bun-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Install Linux desktop runtime
        if: startsWith(matrix.target, 'bun-linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 xauth xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2

      - name: Verify native host ownership
        run: bun test packages/server/src/host/ownership.test.ts

      - id: build
        uses: ./.github/actions/build-binary
        with:
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          target: ${{ matrix.target }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.artifact-path }}
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.build.outputs.desktop-artifact-name }}
          path: ${{ steps.build.outputs.desktop-artifact-path }}
          retention-days: 7
          if-no-files-found: error
