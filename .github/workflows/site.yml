name: Website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/website-analytics/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website
      url: https://thinkrail.ai/
    env:
      PAGES_URL: https://thinkrail-website.pages.dev
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @thinkrail/website build
      - name: Deploy static site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          bunx wrangler@4.124.0 pages deploy apps/website/dist
          --project-name=thinkrail-website
          --branch=main
      - name: Verify deployment
        run: |
          for attempt in $(seq 1 18); do
            ready=true
            for path in / /blog/ /vibecoding/ /robots.txt /sitemap-index.xml; do
              code=$(curl --connect-timeout 5 --max-time 15 -s -o /dev/null -w '%{http_code}' "$PAGES_URL$path" || true)
              [ "$code" = "200" ] || ready=false
            done
            [ "$ready" = "true" ] && exit 0
            echo "attempt $attempt: deployment not ready"
            sleep 5
          done
          exit 1
