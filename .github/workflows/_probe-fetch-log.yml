name: Probe fetch nightly log

on:
  push:
    branches: [ci/probe-nightly-33166583594]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch failing nightly windows job log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/98833375382/logs" \
            -o job.log -w "curl_http=%{http_code}\n" >> status.txt 2>> fetch.err
          wc -c job.log >> status.txt 2>&1
          exit 0

      - name: Report
        if: always()
        run: |
          set +e
          emit() {
            body=$(sed -e 's/%/%25/g' "$2" | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::${body}"
          }
          tr -d '\r' < job.log | sed -e 's/\x1b\[[0-9;]*m//g' > clean.log
          grep -n -i -E 'error|fail|EBUSY|ENOENT|timed out|exited|throw|at [A-Za-z]+ \(' clean.log \
            | grep -v -i -E 'DEBUG|Creating file|Creating parent' | tail -c 3500 > errs.txt
          emit "errors" errs.txt
          tail -c 24000 clean.log > tail.txt
          split -n l/6 -d tail.txt part-
          for p in $(ls part-* | sort -r); do
            emit "tailrev-$p" "$p"
          done
          exit 0
