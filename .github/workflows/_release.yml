name: Release

# Reusable: build every native CLI and desktop artifact and stage one DRAFT release for out-of-repo signing.
# Called by nightly.yml (channel=nightly) and stable.yml (channel=stable).

on:
  workflow_call:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0 or 0.2.0-nightly.5)"
        required: true
        type: string
      channel:
        description: "Release channel: nightly or stable"
        required: true
        type: string
      prev_tag:
        description: "Previous tag of the same channel, for release-notes diff (empty if none)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Push the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The tag push, the remote lookup and pipefail are each load-bearing; see .github/SPEC.md.
          remote=$(git ls-remote --tags origin \
            "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}" | awk '{print $1}')
          if [ -z "$remote" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tagged v${VERSION} at $GITHUB_SHA"
          elif printf '%s\n' "$remote" | grep -qx "$GITHUB_SHA"; then
            echo "v${VERSION} already tags $GITHUB_SHA; re-run, nothing to push"
          else
            echo "::error::v${VERSION} already exists on origin at $(printf '%s' "$remote" | tr '\n' ' ')— not $GITHUB_SHA"
            exit 1
          fi

      - name: Stage the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: >-
            ${{ inputs.channel == 'nightly'
                && format('Nightly {0}', inputs.version)
                || format('v{0}', inputs.version) }}
          draft: true
          prerelease: ${{ inputs.channel == 'nightly' }}
          generate_release_notes: true
          previous_tag: ${{ inputs.prev_tag }}
          files: artifacts/*
          fail_on_unmatched_files: true

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "Staged draft v${VERSION}. JetBrains/thinkrail-signing signs and publishes it." \
            >> "$GITHUB_STEP_SUMMARY"
