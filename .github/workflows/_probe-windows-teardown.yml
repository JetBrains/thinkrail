name: Probe windows teardown fix

on:
  push:
    branches: [ci/probe-nightly-33166583594]

permissions:
  contents: read
  actions: read

jobs:
  binary-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/windows-smoke-teardown-retry
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:binary
      - run: bun run smoke:binary
