name: Probe windows teardown fix

on:
  push:
    branches: [ci/probe-nightly-33166583594]

permissions:
  contents: read
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch failing CI windows binary smoke log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/98840219695/logs" \
            -o job.log -w "curl_http=%{http_code}\n" >> status.txt 2>> fetch.err
          wc -c job.log >> status.txt 2>&1
          exit 0

      - name: Report
        if: always()
        run: |
          set +e
          emit() {
            body=$(sed -e 's/%/%25/g' "$2" | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::${body}"
          }
          tr -d '\r' < job.log | sed -e 's/\x1b\[[0-9;]*m//g' > clean.log
          cat status.txt fetch.err > head.txt 2>/dev/null
          emit "status" head.txt
          tail -c 20000 clean.log > tail.txt
          split -n l/5 -d tail.txt part-
          for p in $(ls part-* | sort -r); do
            emit "tailrev-$p" "$p"
          done
          exit 0
