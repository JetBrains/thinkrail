# coturn for the ThinkRail relay. The secret, realm and external IP come from docker-compose.yml.
listening-port=3478
# TURN over TLS on 443 (for networks that block everything else) needs a certificate; not set up here.
no-tls
no-dtls
min-port=49160
max-port=49200
fingerprint
use-auth-secret
no-cli
no-multicast-peers
# Never relay into private ranges: TURN must not become a way into the server's own network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=stdout
simple-log
