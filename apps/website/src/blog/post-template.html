<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{title}} — ThinkRail Blog</title>
	<link rel="icon" type="image/svg+xml" href="../favicon.svg">
	<link rel="stylesheet" href="./blog.css">
</head>
<body data-theme="dark">
	<header class="blog-header">
		<a href="../" class="blog-logo">ThinkRail</a>
		<nav class="blog-header-nav">
			<a href="./index.html">Blog</a>
			<a href="../">Home</a>
			<button type="button" class="blog-theme-toggle" id="theme-toggle" aria-label="Toggle theme">
				<svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
				<svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
			</button>
		</nav>
	</header>

	<main class="blog-main">
		<article class="blog-post">
			<header class="blog-post-header">
				<h1 class="blog-post-title">{{title}}</h1>
				<div class="blog-post-meta">
					<time class="blog-post-date">{{date}}</time>
					<span class="blog-post-reading-time">{{readingTime}}</span>
					{{tags}}
				</div>
			</header>

			<div class="blog-post-content">
				{{content}}
			</div>

			{{navigation}}
		</article>
	</main>

	<footer class="blog-footer">
		<p>© 2025 ThinkRail. All rights reserved.</p>
	</footer>
	<script>
		// Theme toggle: respects localStorage > system preference > dark default
		(function() {
			const toggle = document.getElementById('theme-toggle');
			const root = document.body;
			
			function getPreferredTheme() {
				const stored = localStorage.getItem('blog-theme');
				if (stored) return stored;
				return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			}
			
			function setTheme(theme) {
				root.setAttribute('data-theme', theme);
				localStorage.setItem('blog-theme', theme);
				toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
			}
			
			// Initialize
			setTheme(getPreferredTheme());
			
			// Toggle on click
			toggle.addEventListener('click', function() {
				const current = root.getAttribute('data-theme');
				setTheme(current === 'dark' ? 'light' : 'dark');
			});
		})();
	</script>
</body>
</html>
