<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{title}} — ThinkRail Blog</title>
	<link rel="icon" type="image/svg+xml" href="../favicon.svg">
	<link rel="stylesheet" href="{{cssPath}}">
	<script>
		// Blocking theme init — runs before first paint to prevent FOUC.
		// Uses the same localStorage key as the main site for unified theme.
		(() => {
			const theme = localStorage.getItem('thinkrail-site-theme') || 'dark';
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
</head>
<body class="blog-page">
	<header class="blog-header">
		<a href="../" class="blog-logo">ThinkRail</a>
		<nav class="blog-header-nav">
			<a href="./index.html">Blog</a>
			<a href="../">Home</a>
			<button type="button" class="blog-theme-toggle" id="theme-toggle" aria-label="Toggle theme">
				<svg class="theme-icon-sun" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
				<svg class="theme-icon-moon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
			</button>
		</nav>
	</header>

	<main class="blog-main">
		<article class="blog-post">
			<header class="blog-post-header">
				<h1 class="blog-post-title">{{title}}</h1>
				<div class="blog-post-meta">
					<time class="blog-post-date">{{date}}</time>
					<span class="blog-post-reading-time">{{readingTime}}</span>
					{{tags}}
				</div>
			</header>

			<div class="blog-post-content">
				{{content}}
			</div>

			{{navigation}}
		</article>
	</main>

	<footer class="blog-footer">
		<p>Copyright © 2026 <a href="https://www.jetbrains.com/" target="_blank" rel="noopener noreferrer">JetBrains</a> InnovationHub · Apache License 2.0</p>
	</footer>
	<script>
		// Theme toggle handler — uses same key as main site.
		(() => {
			const toggle = document.getElementById('theme-toggle');
			const root = document.documentElement;

			toggle.addEventListener('click', () => {
				const current = root.getAttribute('data-theme');
				const next = current === 'dark' ? 'light' : 'dark';
				root.setAttribute('data-theme', next);
				localStorage.setItem('thinkrail-site-theme', next);
				toggle.setAttribute('aria-label', next === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
			});
		})();
	</script>
</body>
</html>
