<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Blog — ThinkRail</title>
	<meta name="description" content="Updates, tutorials, and insights from the ThinkRail team.">
	<link rel="icon" type="image/svg+xml" href="../favicon.svg">
	<link rel="stylesheet" href="./blog.css">
	<script>
		// Blocking theme init — runs before first paint to prevent FOUC.
		// Priority: localStorage > system preference > dark default.
		(function() {
			var stored = localStorage.getItem('blog-theme');
			var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
</head>
<body>
	<header class="blog-header">
		<a href="../" class="blog-logo">ThinkRail</a>
		<nav class="blog-header-nav">
			<a href="./index.html" aria-current="page">Blog</a>
			<a href="../">Home</a>
			<button type="button" class="blog-theme-toggle" id="theme-toggle" aria-label="Toggle theme">
				<svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
				<svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
			</button>
		</nav>
	</header>

	<main class="blog-main">
		<header class="blog-index-header">
			<h1 class="blog-index-title">Blog</h1>
			<p class="blog-index-subtitle">Updates, tutorials, and insights from the ThinkRail team.</p>
		</header>

		<div class="blog-posts-list">
			{{posts}}
		</div>
	</main>

	<footer class="blog-footer">
		<p>© 2025 ThinkRail. All rights reserved.</p>
	</footer>
	<script>
		// Theme toggle handler — wired after DOM is ready.
		(function() {
			var toggle = document.getElementById('theme-toggle');
			var root = document.documentElement;

			toggle.addEventListener('click', function() {
				var current = root.getAttribute('data-theme');
				var next = current === 'dark' ? 'light' : 'dark';
				root.setAttribute('data-theme', next);
				localStorage.setItem('blog-theme', next);
				toggle.setAttribute('aria-label', next === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
			});
		})();
	</script>
</body>
</html>
